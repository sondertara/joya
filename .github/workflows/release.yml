name: Release to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      skip_upload:
        description: '仅构建校验与签名打包，不上传到 Maven Central（dry-run）'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, Sign & Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17 & Central credentials
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username-env-var: CENTRAL_TOKEN_USERNAME
          server-password-env-var: CENTRAL_TOKEN_PASSWORD

      - name: Verify Release tag matches project version
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$TAG_VERSION" <<'PY'
          import sys, xml.etree.ElementTree as ET

          tag_version = sys.argv[1]
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          root_pom = ET.parse("pom.xml").getroot()
          root_ver = (root_pom.findtext("m:version", namespaces=ns) or "").strip()
          if root_ver != tag_version:
              sys.exit(f"Release tag (v{tag_version}) 与 pom.xml version ({root_ver}) 不一致")
          for mod in root_pom.findall("m:modules/m:module", namespaces=ns):
              mod_pom = f"{mod.text.strip()}/pom.xml"
              parent_ver = (ET.parse(mod_pom).getroot().findtext("m:parent/m:version", namespaces=ns) or "").strip()
              if parent_ver != tag_version:
                  sys.exit(f"Release tag (v{tag_version}) 与 {mod_pom} parent.version ({parent_ver}) 不一致")
          print(f"Verified tag v{tag_version} matches root & all module POMs.")
          PY

      - name: Deploy to Maven Central Portal
        run: |
          SKIP_UPLOAD="${{ inputs.skip_upload == true }}"
          mvn -B -ntp clean deploy -Pcentral -Dgpg.signer=bc -DskipUpload="$SKIP_UPLOAD"
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
